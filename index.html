<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tranca TR NCA</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: white;
            padding: 20px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #00d9ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle { text-align: center; color: #888; margin-bottom: 30px; }
        .scores {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .score-card {
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 25px 35px;
            text-align: center;
            min-width: 280px;
            flex: 1;
            max-width: 400px;
        }
        .score-card.joao { border: 3px solid #00d9ff; }
        .score-card.carolina { border: 3px solid #ff6b6b; }
        .score-card h2 {
            font-size: 1.2rem;
            margin-bottom: 10px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .score-card .score {
            font-size: 2.5rem;
            font-weight: bold;
            word-break: break-word;
            line-height: 1.2;
        }
        .score-card.joao .score { color: #00d9ff; }
        .score-card.carolina .score { color: #ff6b6b; }
        
        .add-game {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
        }
        .add-game h3 { margin-bottom: 15px; text-align: center; }
        .add-game form {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }
        .add-game input {
            padding: 15px 20px;
            border-radius: 10px;
            border: 2px solid #333;
            background: #222;
            color: white;
            font-size: 1.2rem;
            width: 180px;
            text-align: center;
        }
        .add-game button {
            padding: 15px 35px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(90deg, #00d9ff, #00ff88);
            color: #1a1a2e;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
        }
        
        .chart-container {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            height: 400px;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
        }
        .stat-card h4 { color: #888; font-size: 0.85rem; margin-bottom: 10px; }
        .stat-card .value { font-size: 1.4rem; font-weight: bold; }
        .stat-card .value.win { color: #00ff88; }
        
        .history {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 20px;
        }
        .history h3 { margin-bottom: 15px; text-align: center; }
        .history table { width: 100%; border-collapse: collapse; }
        .history th, .history td { padding: 12px; text-align: center; border-bottom: 1px solid #333; }
        .history th { color: #888; text-transform: uppercase; font-size: 0.8rem; }
        .history .joao { color: #00d9ff; font-weight: bold; }
        .history .carolina { color: #ff6b6b; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 Tranca TR NCA</h1>
        <p class="subtitle">João vs Carolina</p>
        
        <div class="scores">
            <div class="score-card joao">
                <h2>João</h2>
                <div class="score" id="joaoScore">-</div>
            </div>
            <div class="score-card carolina">
                <h2>Carolina</h2>
                <div class="score" id="carolinaScore">-</div>
            </div>
        </div>
        
        <div class="add-game">
            <h3>➕ Adicionar Jogo</h3>
            <form id="addGameForm">
                <input type="number" id="joaoPoints" placeholder="João" required>
                <input type="number" id="carolinaPoints" placeholder="Carolina" required>
                <button type="submit">Adicionar</button>
            </form>
        </div>
        
        <div class="stats">
            <div class="stat-card">
                <h4>Jogos</h4>
                <div class="value" id="totalGames">0</div>
            </div>
            <div class="stat-card">
                <h4>Maior Vitória João</h4>
                <div class="value win" id="joaoBiggestWin">0</div>
            </div>
            <div class="stat-card">
                <h4>Maior Vitória Carolina</h4>
                <div class="value win" id="carolinaBiggestWin">0</div>
            </div>
        </div>
        
        <div class="chart-container">
            <canvas id="scoreChart"></canvas>
        </div>
        
        <div class="history">
            <h3>📋 Histórico</h3>
            <table>
                <thead>
                    <tr><th>#</th><th>João</th><th>Carolina</th><th>Vencedor</th></tr>
                </thead>
                <tbody id="historyBody"></tbody>
            </table>
        </div>
    </div>
    
    <script>
        console.log('Script starting...');
        
        // Starting totals
        const INITIAL_JOAO = 14730;
        const INITIAL_CAROLINA = 16800;
        
        // Game scores (the +xxx values)
        const gameData = [
            { joao: 760, carolina: 1200 },
            { joao: 640, carolina: 50 },
            { joao: 1250, carolina: 690 },
            { joao: -350, carolina: 470 },
            { joao: 1050, carolina: 1150 },
            { joao: 290, carolina: 690 },
            { joao: 600, carolina: 1100 },
            { joao: 240, carolina: 880 },
            { joao: 1200, carolina: 690 },
            { joao: 260, carolina: 630 },
            { joao: 680, carolina: -330 },
            { joao: 1120, carolina: 750 },
            { joao: 870, carolina: 650 }
        ];
        
        console.log('Initial totals:', INITIAL_JOAO, INITIAL_CAROLINA);
        console.log('Games:', gameData.length);
        
        function getTotals() {
            let j = INITIAL_JOAO;
            let c = INITIAL_CAROLINA;
            gameData.forEach(g => {
                j += g.joao;
                c += g.carolina;
            });
            return { joao: j, carolina: c };
        }
        
        function render() {
            const totals = getTotals();
            console.log('Totals:', totals);
            
            document.getElementById('joaoScore').textContent = totals.joao.toLocaleString();
            document.getElementById('carolinaScore').textContent = totals.carolina.toLocaleString();
            document.getElementById('totalGames').textContent = gameData.length;
            
            // Biggest wins
            let jWin = 0, cWin = 0;
            gameData.forEach(g => {
                if (g.joao > g.carolina) jWin = Math.max(jWin, g.joao - g.carolina);
                if (g.carolina > g.joao) cWin = Math.max(cWin, g.carolina - g.joao);
            });
            document.getElementById('joaoBiggestWin').textContent = '+' + jWin;
            document.getElementById('carolinaBiggestWin').textContent = '+' + cWin;
            
            // History table
            const tbody = document.getElementById('historyBody');
            tbody.innerHTML = '';
            gameData.forEach((g, i) => {
                const tr = document.createElement('tr');
                const winner = g.joao > g.carolina ? 'João' : 'Carolina';
                tr.innerHTML = `
                    <td>${i + 1}</td>
                    <td class="joao">${g.joao >= 0 ? '+' : ''}${g.joao}</td>
                    <td class="carolina">${g.carolina >= 0 ? '+' : ''}${g.carolina}</td>
                    <td>${winner}</td>
                `;
                tbody.appendChild(tr);
            });
            
            // Chart
            renderChart();
        }
        
        let chart = null;
        function renderChart() {
            const ctx = document.getElementById('scoreChart').getContext('2d');
            
            let j = INITIAL_JOAO, c = INITIAL_CAROLINA;
            const labels = ['Início'];
            const jData = [j], cData = [c];
            
            gameData.forEach((g, i) => {
                j += g.joao;
                c += g.carolina;
                labels.push('Jogo ' + (i + 1));
                jData.push(j);
                cData.push(c);
            });
            
            console.log('Chart data:', { labels, jData, cData });
            
            if (chart) chart.destroy();
            
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        { label: 'João', data: jData, borderColor: '#00d9ff', backgroundColor: 'rgba(0,217,255,0.1)', fill: true, tension: 0.3 },
                        { label: 'Carolina', data: cData, borderColor: '#ff6b6b', backgroundColor: 'rgba(255,107,107,0.1)', fill: true, tension: 0.3 }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { ticks: { color: '#888' }, grid: { color: '#333' } },
                        x: { ticks: { color: '#888' }, grid: { color: '#333' } }
                    },
                    plugins: { legend: { labels: { color: 'white' } } }
                }
            });
        }
        
        document.getElementById('addGameForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const j = parseInt(document.getElementById('joaoPoints').value);
            const c = parseInt(document.getElementById('carolinaPoints').value);
            if (!isNaN(j) && !isNaN(c)) {
                gameData.push({ joao: j, carolina: c });
                render();
                document.getElementById('joaoPoints').value = '';
                document.getElementById('carolinaPoints').value = '';
            }
        });
        
        // Start
        console.log('Rendering...');
        render();
    </script>
</body>
</html>
