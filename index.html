<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trinca TR NCA</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: white;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #00d9ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
        }
        .scores {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .score-card {
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 25px 35px;
            text-align: center;
            min-width: 280px;
            flex: 1;
            max-width: 400px;
        }
        .score-card.joao {
            border: 3px solid #00d9ff;
        }
        .score-card.carolina {
            border: 3px solid #ff6b6b;
        }
        .score-card h2 {
            font-size: 1.2rem;
            margin-bottom: 10px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .score-card .score {
            font-size: 2.8rem;
            font-weight: bold;
            word-break: break-word;
            line-height: 1.2;
        }
        .score-card.joao .score { color: #00d9ff; }
        .score-card.carolina .score { color: #ff6b6b; }
        .difference {
            font-size: 1.2rem;
            margin-top: 8px;
            font-weight: bold;
        }
        .difference.joao { color: #00d9ff; }
        .difference.carolina { color: #ff6b6b; }
        
        .add-game {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
        }
        .add-game h3 {
            margin-bottom: 15px;
            text-align: center;
        }
        .add-game form {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }
        .add-game input {
            padding: 15px 20px;
            border-radius: 10px;
            border: 2px solid #333;
            background: #222;
            color: white;
            font-size: 1.2rem;
            width: 180px;
            text-align: center;
        }
        .add-game input::placeholder {
            color: #666;
            font-size: 1rem;
        }
        .add-game button {
            padding: 15px 35px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(90deg, #00d9ff, #00ff88);
            color: #1a1a2e;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .add-game button:hover {
            transform: scale(1.05);
        }
        
        .chart-container {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
        }
        .chart-container h3 {
            margin-bottom: 15px;
            text-align: center;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
        }
        .stat-card h4 {
            color: #888;
            font-size: 0.85rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .stat-card .value {
            font-size: 1.4rem;
            font-weight: bold;
        }
        .stat-card .value.win { color: #00ff88; }
        .stat-card .value.loss { color: #ff6b6b; }
        .stat-card .value.games { color: #ffd93d; }
        
        .history {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 20px;
        }
        .history h3 {
            margin-bottom: 15px;
            text-align: center;
        }
        .history table {
            width: 100%;
            border-collapse: collapse;
        }
        .history th, .history td {
            padding: 12px 8px;
            text-align: center;
            border-bottom: 1px solid #333;
            font-size: 0.95rem;
        }
        .history th {
            color: #888;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }
        .history .joao { color: #00d9ff; font-weight: bold; }
        .history .carolina { color: #ff6b6b; font-weight: bold; }
        .history .winner-joao { background: rgba(0,217,255,0.15); }
        .history .winner-carolina { background: rgba(255,107,107,0.15); }
        
        .clear-btn {
            margin-top: 20px;
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid #ff4444;
            background: transparent;
            color: #ff4444;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 Trinca TR NCA</h1>
        <p class="subtitle">João vs Carolina - Scoreboard</p>
        
        <div class="scores">
            <div class="score-card joao">
                <h2>João</h2>
                <div class="score" id="joaoScore">0</div>
                <div class="difference joao" id="joaoDiff"></div>
            </div>
            <div class="score-card carolina">
                <h2>Carolina</h2>
                <div class="score" id="carolinaScore">0</div>
                <div class="difference carolina" id="carolinaDiff"></div>
            </div>
        </div>
        
        <div class="add-game">
            <h3>➕ Adicionar Jogo</h3>
            <form id="addGameForm">
                <input type="number" id="joaoPoints" placeholder="João" required>
                <input type="number" id="carolinaPoints" placeholder="Carolina" required>
                <button type="submit">Adicionar</button>
            </form>
        </div>
        
        <div class="stats">
            <div class="stat-card">
                <h4>Total de Jogos</h4>
                <div class="value games" id="totalGames">0</div>
            </div>
            <div class="stat-card">
                <h4>Maior Vitória João</h4>
                <div class="value win" id="joaoBiggestWin">0</div>
            </div>
            <div class="stat-card">
                <h4>Maior Vitória Carolina</h4>
                <div class="value win" id="carolinaBiggestWin">0</div>
            </div>
            <div class="stat-card">
                <h4>Líder</h4>
                <div class="value" id="whoWinning" style="font-size: 1.2rem;">-</div>
            </div>
        </div>
        
        <div class="chart-container">
            <h3>📈 Evolução ao Longo do Tempo</h3>
            <canvas id="scoreChart"></canvas>
        </div>
        
        <div class="history">
            <h3>📋 Histórico de Jogos</h3>
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>João</th>
                        <th>Carolina</th>
                        <th>Vencedor</th>
                    </tr>
                </thead>
                <tbody id="historyBody"></tbody>
            </table>
            <button class="clear-btn" onclick="clearAllData()">🗑️ Limpar Tudo</button>
        </div>
    </div>
    
    <script>
        // Initial totals (starting scores)
        const INITIAL_JOAO = 14730;
        const INITIAL_CAROLINA = 16800;
        
        // Game results only (the +xxx or -xxx values)
        const initialGames = [
            { joao: 760, carolina: 1200 },
            { joao: 640, carolina: 50 },
            { joao: 1250, carolina: 690 },
            { joao: -350, carolina: 470 },
            { joao: 1050, carolina: 1150 },
            { joao: 290, carolina: 690 },
            { joao: 600, carolina: 1100 },
            { joao: 240, carolina: 880 },
            { joao: 1200, carolina: 690 },
            { joao: 260, carolina: 630 },
            { joao: 680, carolina: -330 },
            { joao: 1120, carolina: 750 },
            { joao: 870, carolina: 650 },
        ];
        
        // Load from localStorage or use initial data
        let games = JSON.parse(localStorage.getItem('trincaGames')) || initialGames;
        
        function saveGames() {
            localStorage.setItem('trincaGames', JSON.stringify(games));
        }
        
        function calculateTotals() {
            let joaoTotal = INITIAL_JOAO;
            let carolinaTotal = INITIAL_CAROLINA;
            
            games.forEach(game => {
                joaoTotal += game.joao;
                carolinaTotal += game.carolina;
            });
            
            return { joao: joaoTotal, carolina: carolinaTotal };
        }
        
        function updateDisplay() {
            const totals = calculateTotals();
            
            document.getElementById('joaoScore').textContent = totals.joao.toLocaleString('pt-BR');
            document.getElementById('carolinaScore').textContent = totals.carolina.toLocaleString('pt-BR');
            
            const diff = totals.joao - totals.carolina;
            if (diff > 0) {
                document.getElementById('joaoDiff').textContent = `+${diff.toLocaleString('pt-BR')}`;
                document.getElementById('joaoDiff').style.display = 'block';
                document.getElementById('carolinaDiff').style.display = 'none';
            } else if (diff < 0) {
                document.getElementById('carolinaDiff').textContent = diff.toLocaleString('pt-BR');
                document.getElementById('carolinaDiff').style.display = 'block';
                document.getElementById('joaoDiff').style.display = 'none';
            } else {
                document.getElementById('joaoDiff').style.display = 'none';
                document.getElementById('carolinaDiff').style.display = 'none';
            }
            
            document.getElementById('totalGames').textContent = games.length;
            
            // Calculate biggest wins
            let joaoBiggestWin = 0, carolinaBiggestWin = 0;
            games.forEach(game => {
                if (game.joao > game.carolina && game.joao - game.carolina > joaoBiggestWin) {
                    joaoBiggestWin = game.joao - game.carolina;
                }
                if (game.carolina > game.joao && game.carolina - game.joao > carolinaBiggestWin) {
                    carolinaBiggestWin = game.carolina - game.joao;
                }
            });
            document.getElementById('joaoBiggestWin').textContent = '+' + joaoBiggestWin.toLocaleString('pt-BR');
            document.getElementById('carolinaBiggestWin').textContent = '+' + carolinaBiggestWin.toLocaleString('pt-BR');
            
            if (diff > 0) {
                document.getElementById('whoWinning').textContent = 'João 🏆';
                document.getElementById('whoWinning').style.color = '#00d9ff';
            } else if (diff < 0) {
                document.getElementById('whoWinning').textContent = 'Carolina 🏆';
                document.getElementById('whoWinning').style.color = '#ff6b6b';
            }
            
            // History table
            const tbody = document.getElementById('historyBody');
            tbody.innerHTML = '';
            games.forEach((game, i) => {
                const row = document.createElement('tr');
                const winner = game.joao > game.carolina ? 'João' : (game.carolina > game.joao ? 'Carolina' : 'Empate');
                const winnerClass = game.joao > game.carolina ? 'winner-joao' : (game.carolina > game.joao ? 'winner-carolina' : '');
                row.className = winnerClass;
                const joaoSign = game.joao >= 0 ? '+' : '';
                const carolinaSign = game.carolina >= 0 ? '+' : '';
                row.innerHTML = `
                    <td>${i + 1}</td>
                    <td class="joao">${joaoSign}${game.joao.toLocaleString('pt-BR')}</td>
                    <td class="carolina">${carolinaSign}${game.carolina.toLocaleString('pt-BR')}</td>
                    <td>${winner}</td>
                `;
                tbody.appendChild(row);
            });
            
            updateChart();
        }
        
        let chart;
        function updateChart() {
            const ctx = document.getElementById('scoreChart').getContext('2d');
            
            let joaoRunning = INITIAL_JOAO;
            let carolinaRunning = INITIAL_CAROLINA;
            
            const labels = ['Início'];
            const joaoData = [INITIAL_JOAO];
            const carolinaData = [INITIAL_CAROLINA];
            
            games.forEach((game, i) => {
                joaoRunning += game.joao;
                carolinaRunning += game.carolina;
                labels.push(`Jogo ${i + 1}`);
                joaoData.push(joaoRunning);
                carolinaData.push(carinaRunning);
            });
            
            if (chart) chart.destroy();
            
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'João',
                            data: joaoData,
                            borderColor: '#00d9ff',
                            backgroundColor: 'rgba(0,217,255,0.1)',
                            fill: true,
                            tension: 0.4,
                            pointRadius: 4,
                            pointHoverRadius: 6
                        },
                        {
                            label: 'Carolina',
                            data: carolinaData,
                            borderColor: '#ff6b6b',
                            backgroundColor: 'rgba(255,107,107,0.1)',
                            fill: true,
                            tension: 0.4,
                            pointRadius: 4,
                            pointHoverRadius: 6
                        }
                    ]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            labels: { color: 'white', font: { size: 14 } }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return context.dataset.label + ': ' + context.parsed.y.toLocaleString('pt-BR');
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            ticks: { color: '#888', maxRotation: 45 },
                            grid: { color: '#333' }
                        },
                        y: {
                            ticks: { 
                                color: '#888',
                                callback: function(value) {
                                    return value.toLocaleString('pt-BR');
                                }
                            },
                            grid: { color: '#333' }
                        }
                    }
                }
            });
        }
        
        document.getElementById('addGameForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const joaoPoints = parseInt(document.getElementById('joaoPoints').value);
            const carolinaPoints = parseInt(document.getElementById('carolinaPoints').value);
            
            if (!isNaN(joaoPoints) && !isNaN(carolinaPoints)) {
                games.push({ joao: joaoPoints, carolina: carolinaPoints });
                saveGames();
                updateDisplay();
                
                document.getElementById('joaoPoints').value = '';
                document.getElementById('carolinaPoints').value = '';
            }
        });
        
        function clearAllData() {
            if (confirm('Tem certeza que deseja limpar todos os jogos?')) {
                games = [];
                saveGames();
                updateDisplay();
            }
        }
        
        // Initialize
        updateDisplay();
    </script>
</body>
</html>
